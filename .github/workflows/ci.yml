name: ci

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx ng build --configuration production
      - run: npx ng test --watch=false

  database:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Ci-Sa#Passw0rd", MSSQL_PID: Developer }
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci-Sa#Passw0rd' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Deploy schema + 20K-meter demo fleet + refresh
        run: |
          docker build -t smartmeter-db-init database
          docker run --rm --network host -e SQL_SERVER=localhost,1433 -e SQL_USER=sa -e 'SQL_PASSWORD=Ci-Sa#Passw0rd' \
            -e 'APP_DB_PASSWORD=Ci-App#Passw0rd' -e SEED_DEMO_METERS=20000 smartmeter-db-init
      - name: Re-deploy is idempotent
        run: |
          docker run --rm --network host -e SQL_SERVER=localhost,1433 -e SQL_USER=sa -e 'SQL_PASSWORD=Ci-Sa#Passw0rd' \
            -e 'APP_DB_PASSWORD=Ci-App#Passw0rd' smartmeter-db-init

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t smartmeter-api backend
      - run: docker build -t smartmeter-web frontend
